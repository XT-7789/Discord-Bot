<section class="panel"><h2>🔐 Command Access</h2><div class="top-actions"><input id="command-search" class="command-search" placeholder="Search commands, for example: attack"><span class="badge">{{rows|length}} Commands</span></div><div class="notice">Search and select Discord roles, users and channels. Multiple choices are supported. Administrators bypass role and cooldown rules, but disabled commands stay disabled.</div><div class="library command-grid">{% for r in rows %}<article class="library-card command-card" data-command="{{r['command_name']|lower}}"><h3>/{{r['command_name']}}</h3><form class="fields" method="post"><input type="hidden" name="command_name" value="{{r['command_name']}}"><div class="fields-grid"><label>Command Status<select name="enabled"><option value="1" {% if r['enabled'] %}selected{% endif %}>Enabled</option><option value="0" {% if not r['enabled'] %}selected{% endif %}>Disabled</option></select></label><label>Who Can Use<select name="access_mode"><option value="everyone" {% if r['access_mode']=='everyone' %}selected{% endif %}>Everyone</option><option value="admin" {% if r['access_mode']=='admin' %}selected{% endif %}>Administrators Only</option><option value="roles" {% if r['access_mode']=='roles' %}selected{% endif %}>Selected Roles</option><option value="users" {% if r['access_mode']=='users' %}selected{% endif %}>Selected Users</option></select></label><label>Allowed Roles<input name="allowed_role_ids" value="{{r['allowed_role_ids']}}"></label><label>Blocked Roles<input name="blocked_role_ids" value="{{r['blocked_role_ids']}}"></label><label>Allowed Users<input name="allowed_user_ids" value="{{r['allowed_user_ids']}}"></label><label>Allowed Channels<select multiple name="allowed_channel_ids">{% for c in server_channels %}<option value="{{c['id']}}" {% if c['id'] in r['allowed_channel_ids'].split(',') %}selected{% endif %}># {{c['name']}}</option>{% endfor %}</select></label><label>Blocked Channels<select multiple name="blocked_channel_ids">{% for c in server_channels %}<option value="{{c['id']}}" {% if c['id'] in r['blocked_channel_ids'].split(',') %}selected{% endif %}># {{c['name']}}</option>{% endfor %}</select></label><label>Cooldown Seconds<input type="number" min="0" name="cooldown_seconds" value="{{r['cooldown_seconds']}}"></label><label>Cooldown Scope<select name="cooldown_scope"><option value="user" {% if r['cooldown_scope']=='user' %}selected{% endif %}>Per User</option><option value="guild" {% if r['cooldown_scope']=='guild' %}selected{% endif %}>Server-wide</option><option value="global" {% if r['cooldown_scope']=='global' %}selected{% endif %}>Global</option></select></label><label>Cooldown Bypass Roles<input name="cooldown_bypass_role_ids" value="{{r['cooldown_bypass_role_ids']}}"></label><label>Required Discord Permissions<input name="required_permissions" value="{{r['required_permissions']}}" placeholder="manage_roles, manage_messages"></label><label>Discord Usage Log<select name="log_usage"><option value="1" {% if r['log_usage'] %}selected{% endif %}>On</option><option value="0" {% if not r['log_usage'] %}selected{% endif %}>Off</option></select></label></div><button>Save Command</button></form></article>{% endfor %}</div></section>
