<section class="panel"><h2>📨 Log Settings System</h2><div class="notice">Choose a server channel. Command logs are sent immediately when Usage Log is enabled in Command Access.</div><div class="library">{% for r in rows %}<article class="library-card"><h3>{{r['log_type']|title}} Logs</h3><form class="fields" method="post"><input type="hidden" name="log_type" value="{{r['log_type']}}"><label>Status<select name="enabled"><option value="1" {% if r['enabled'] %}selected{% endif %}>Enabled</option><option value="0" {% if not r['enabled'] %}selected{% endif %}>Disabled</option></select></label><label>Discord Channel<select name="channel_id"><option value="0">No Discord Channel</option>{% for channel in server_channels %}<option value="{{channel['id']}}" {% if r['channel_id']==channel['id'] %}selected{% endif %}># {{channel['name']}}</option>{% endfor %}</select></label><label>Mention @Role / ID<input name="mention_role_id" value="{{r['mention_role_id']}}"></label><label>Success Events<select name="log_success"><option value="1" {% if r['log_success'] %}selected{% endif %}>Log</option><option value="0" {% if not r['log_success'] %}selected{% endif %}>Ignore</option></select></label><label>Failure Events<select name="log_failure"><option value="1" {% if r['log_failure'] %}selected{% endif %}>Log</option><option value="0" {% if not r['log_failure'] %}selected{% endif %}>Ignore</option></select></label><button>Save Log</button></form></article>{% endfor %}</div></section>
