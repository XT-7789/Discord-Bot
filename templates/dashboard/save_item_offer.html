<section class="panel"><h2>🎭 Role Shop Control</h2><form class="fields" method="post" action="{{url_for('toggle_system',key='role_shop_enabled')}}"><input type="hidden" name="return_to" value="role_shop_control"><input type="hidden" name="enabled" value="{{0 if enabled=='1' else 1}}"><button class="{{'danger' if enabled=='1' else 'teal'}}">{{'Close Role Shop' if enabled=='1' else 'Open Role Shop'}}</button></form></section><details class="creator"><summary class="btn">＋ Sell New Role</summary><section class="panel"><h2>Create Role Offer</h2><form class="fields" method="post" action="{{url_for('save_role_offer')}}"><div class="fields-grid"><label>Display Name<input name="name" required></label><label>Discord @Role or Role ID<input name="role_id" placeholder="@VIP or 123456789" required></label><label>Emoji<input name="emoji" value="🎭"></label><label>Description<textarea name="description"></textarea></label><label>Price<input type="number" min="0" name="price" value="1000"></label><label>Currency<select name="currency"><option value="xc">XC</option><option value="xcrystals">XCrystals</option></select></label><label>Stock (-1 unlimited)<input type="number" min="-1" name="stock" value="-1"></label><label>Enabled<select name="enabled"><option value="1">Yes</option><option value="0">No</option></select></label></div><button>Save Role</button></form></section></details><section class="panel"><h2>Roles for Sale</h2><div class="library">{% for r in rows %}<article class="library-card"><h3>{{r['emoji']}} {{r['name']}}</h3><p>{{r['description']}}</p><div class="statline">Role: &lt;@&{{r['role_id']}}&gt;<br>Price: {{r['price']}} {{r['currency']}}<br>Stock: {{'Unlimited' if r['stock']<0 else r['stock']}}</div><form class="fields" method="post" action="{{url_for('save_role_offer')}}"><input type="hidden" name="id" value="{{r['id']}}"><input name="name" value="{{r['name']}}"><input name="role_id" value="{{r['role_id']}}"><input name="emoji" value="{{r['emoji']}}"><textarea name="description">{{r['description']}}</textarea><input type="number" min="0" name="price" value="{{r['price']}}"><select name="currency"><option value="xc" {% if r['currency']=='xc' %}selected{% endif %}>XC</option><option value="xcrystals" {% if r['currency']=='xcrystals' %}selected{% endif %}>XCrystals</option></select><input type="number" min="-1" name="stock" value="{{r['stock']}}"><select name="enabled"><option value="1" {% if r['enabled'] %}selected{% endif %}>Enabled</option><option value="0" {% if not r['enabled'] %}selected{% endif %}>Disabled</option></select><button>Save</button></form></article>{% endfor %}</div></section>
