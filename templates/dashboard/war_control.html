<section class="panel"><h2>Alliance War Control</h2><div class="pad">{% if active %}<p class="bad"><b>War #{{active['id']}} is active.</b></p><form class="fields-grid" method="post" action="{{url_for('end_war_dashboard')}}"><label>Winner (optional)<select name="winner"><option value="">No winner</option>{% for a in alliances %}{% if a['id'] in [active['attacker_alliance_id'],active['defender_alliance_id']] %}<option value="{{a['id']}}">[{{a['tag']}}] {{a['name']}}</option>{% endif %}{% endfor %}</select></label><div class="actions"><button>End War</button></div></form>{% else %}<p class="ok">No active war.</p><form class="fields-grid" method="post" action="{{url_for('start_war_dashboard')}}"><label>Attacker<select name="attacker" required>{% for a in alliances %}<option value="{{a['id']}}">[{{a['tag']}}] {{a['name']}}</option>{% endfor %}</select></label><label>Defender<select name="defender" required>{% for a in alliances %}<option value="{{a['id']}}">[{{a['tag']}}] {{a['name']}}</option>{% endfor %}</select></label><div class="actions"><button>Start War</button></div></form>{% endif %}</div></section><section class="panel"><h2>Alliance Management</h2><table><tr><th>Alliance</th><th>Leader Discord ID</th><th>Save</th></tr>{% for a in alliances %}<tr><form method="post" action="{{url_for('save_alliance',alliance_id=a['id'])}}"><td><div class="inline"><input name="tag" value="{{a['tag']}}" maxlength="5" required><input name="name" value="{{a['name']}}" maxlength="30" required></div></td><td><input name="leader_id" type="number" value="{{a['leader_id']}}" required></td><td><button>Save</button></td></form></tr>{% else %}<tr><td colspan="3">No Alliances. Players can use /alliance_create.</td></tr>{% endfor %}</table></section>
